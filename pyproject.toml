[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devtool-forge"
version = "0.1.0"
description = "A small plugin-first developer tool demonstrating maintainable customization."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mradul Singh"}]
dependencies = []

[project.scripts]
devforge = "devtool_forge.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
